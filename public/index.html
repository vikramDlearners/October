<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sloth Trip Watcher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <span class="logo">🦥</span>
        <div>
          <h1>Sloth Trip Watcher</h1>
          <p class="tagline">Tell it once. Do nothing. It tells you when to go, how to get there, and what to pack.</p>
        </div>
      </div>
      <div id="status" class="status"></div>
      <details class="backend">
        <summary><span id="conn-dot" class="dot"></span> Backend</summary>
        <form id="connect-form" class="connect">
          <input id="api-base" placeholder="https://your-server.example.com (blank = this server)" autocomplete="url" aria-label="Backend URL">
          <button type="submit">Connect</button>
          <p id="conn" class="conn" role="status"></p>
        </form>
      </details>
    </div>
  </header>

  <main>
    <section class="card new-watch">
      <h2>Plan a lazy trip</h2>
      <p class="sub">Set it once. The sloth checks the weather every few hours.</p>
      <form id="watch-form">
        <label>Where to?
          <input name="destination" placeholder="Pondicherry" required>
        </label>
        <label>Starting from
          <input name="origin" placeholder="Chennai" required>
        </label>
        <div class="row">
          <label>Earliest
            <input name="from" type="date" required>
          </label>
          <label>Latest
            <input name="to" type="date" required>
          </label>
        </div>
        <label>Budget per person (₹, all-in)
          <input name="budgetInr" type="number" min="100" step="100" value="5000" required>
        </label>
        <label>Vibe <span class="hint">optional</span>
          <input name="vibe" placeholder="beaches, cafés, quiet">
        </label>
        <div class="checks">
          <label class="toggle"><input type="checkbox" name="weekendsOnly" checked><span>Weekends only</span></label>
          <label class="toggle"><input type="checkbox" name="noRain" checked><span>No rain</span></label>
        </div>
        <button type="submit" class="primary">Start watching</button>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="list">
      <h2 class="list-title">Watching</h2>
      <div id="watches"></div>
    </section>
  </main>

  <footer>Weather by Open-Meteo · places by Google Maps via SerpApi · plans by Gemma</footer>

  <template id="watch-tpl">
    <article class="card watch">
      <div class="watch-head">
        <div>
          <h3 class="dest"></h3>
          <div class="chips"></div>
        </div>
        <div class="actions">
          <button class="check-now">Check now</button>
          <button class="delete ghost" title="Stop watching" aria-label="Stop watching">✕</button>
        </div>
      </div>
      <div class="result"></div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
