services:
  - type: web
    name: sloth-trip-watcher
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CHECK_EVERY_HOURS
        value: "12"
      - key: GEMMA_MODEL
        value: gemma-4-31b-it
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ITINERARY_API_URL
        sync: false
      - key: ITINERARY_API_KEY
        sync: false
